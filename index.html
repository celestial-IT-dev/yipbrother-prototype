<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yip Brother - OMS</title>
    <script type="text/javascript">
      // Handle redirect from 404.html for GitHub Pages
      (function () {
        var redirectPath = sessionStorage.getItem('redirectPath');
        if (redirectPath) {
          sessionStorage.removeItem('redirectPath');
          // Only replace history if we're not already on that path
          if (redirectPath !== location.pathname + location.search + location.hash) {
            history.replaceState(null, null, redirectPath);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
