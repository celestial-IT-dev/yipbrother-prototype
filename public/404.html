<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Single Page App</title>
    <script type="text/javascript">
      // Store the full pathname and search params
      // location.pathname includes the full path like /yipbrother-prototype/login
      var fullPath = location.pathname + (location.search || '') + (location.hash || '');
      
      // Store in sessionStorage for index.html to read
      sessionStorage.setItem('redirectPath', fullPath);

      var segments = location.pathname.split('/').filter(Boolean);
      var isGithubProjectSite = location.hostname.endsWith('github.io');
      var appBase = isGithubProjectSite && segments.length > 0
        ? '/' + segments[0] + '/'
        : '/';
      var target = appBase + 'index.html';

      if (location.pathname !== target) {
        location.replace(target);
      }
    </script>
  </head>
  <body></body>
</html>
